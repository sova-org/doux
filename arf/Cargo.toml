[package]
name = "arf"
version = "0.1.0"
edition = "2024"
description = "A live-codable graph audio engine — the pure VM core doux embeds"
license = "AGPL-3.0-only"
repository = "https://github.com/Bubobubobubobubo/doux"

[dependencies]
# Serialize the authoring graph: round-trippable serde derives on the graph model (the
# language-agnostic patch boundary a host deserializes) plus the visualizer's `to_json`.
# Off the audio path — only touched on a program swap / install.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
